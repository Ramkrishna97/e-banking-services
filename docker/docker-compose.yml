services:
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: ebanking, MYSQL_PASSWORD: ebanking }
    ports: ["3306:3306"]
    volumes: ["../database/ddl:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
  discovery-server:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: platform/discovery-server } }
    ports: ["8761:8761"]
  config-server:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: platform/config-server } }
    ports: ["8888:8888"]
  api-gateway:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: platform/api-gateway } }
    ports: ["8080:8080"]
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, REDIS_HOST: redis, JWT_SECRET: change-me-in-production-32-bytes-minimum }
    depends_on: [discovery-server, redis]
  auth-kyc-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/auth-kyc-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:mysql://mysql:3306/user_kyc_db, DB_USER: ebanking, DB_PASSWORD: ebanking, JWT_SECRET: change-me-in-production-32-bytes-minimum }
    depends_on: [mysql, discovery-server]
  account-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/account-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:mysql://mysql:3306/account_db, DB_USER: ebanking, DB_PASSWORD: ebanking }
    depends_on: [mysql, discovery-server]
  fund-transfer-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/fund-transfer-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:mysql://mysql:3306/transaction_ledger_db, DB_USER: ebanking, DB_PASSWORD: ebanking, REDIS_HOST: redis, KAFKA_BOOTSTRAP_SERVERS: kafka:9092 }
    depends_on: [mysql, redis, kafka, discovery-server]
  loan-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/loan-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:mysql://mysql:3306/loan_db, DB_USER: ebanking, DB_PASSWORD: ebanking }
    depends_on: [mysql, discovery-server]
  card-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/card-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:mysql://mysql:3306/card_db, DB_USER: ebanking, DB_PASSWORD: ebanking }
    depends_on: [mysql, discovery-server]
  notification-fraud-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/notification-fraud-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, KAFKA_BOOTSTRAP_SERVERS: kafka:9092 }
    depends_on: [kafka, discovery-server]
