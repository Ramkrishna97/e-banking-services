services:
  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api-gateway]
  discovery-server:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: platform/discovery-server } }
    ports: ["127.0.0.1:8761:8761"]
  api-gateway:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: platform/api-gateway } }
    ports: ["127.0.0.1:8080:8080"]
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, JWT_SECRET: change-me-in-production-32-bytes-minimum }
    depends_on: [discovery-server]
  auth-kyc-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/auth-kyc-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:h2:file:/app/data/user_kyc_db, JWT_SECRET: change-me-in-production-32-bytes-minimum }
    volumes: ["h2-data:/app/data"]
    depends_on: [discovery-server]
  account-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/account-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:h2:file:/app/data/account_db }
    volumes: ["h2-data:/app/data"]
    depends_on: [discovery-server]
  fund-transfer-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/fund-transfer-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:h2:file:/app/data/transaction_ledger_db }
    volumes: ["h2-data:/app/data"]
    depends_on: [discovery-server]
  loan-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/loan-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka }
    depends_on: [discovery-server]
  card-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/card-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka, DB_URL: jdbc:h2:file:/app/data/card_db }
    volumes: ["h2-data:/app/data"]
    depends_on: [discovery-server]
  notification-fraud-service:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: services/notification-fraud-service } }
    environment: { EUREKA_URL: http://discovery-server:8761/eureka }
    depends_on: [discovery-server]

volumes:
  h2-data:
