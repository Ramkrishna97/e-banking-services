server.port: 8083
spring:
  application.name: fund-transfer-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transaction_ledger_db}
    username: ${DB_USER:ebanking}
    password: ${DB_PASSWORD:ebanking}
  jpa.hibernate.ddl-auto: validate
  data.redis.host: ${REDIS_HOST:localhost}
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
resilience4j.circuitbreaker.instances.paymentSwitch.slidingWindowSize: 10
