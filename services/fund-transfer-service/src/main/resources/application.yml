server.port: 8083
spring:
  application.name: fund-transfer-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/transaction_ledger_db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa.hibernate.ddl-auto: ${DB_DDL_AUTO:update}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
resilience4j.circuitbreaker.instances.paymentSwitch.slidingWindowSize: 10
