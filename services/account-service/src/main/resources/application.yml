server.port: 8082
spring:
  application.name: account-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/account_db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa.hibernate.ddl-auto: ${DB_DDL_AUTO:update}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
