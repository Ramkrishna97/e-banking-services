server.port: 8081
spring:
  application.name: auth-kyc-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_kyc_db}
    username: ${DB_USER:ebanking}
    password: ${DB_PASSWORD:ebanking}
  jpa.hibernate.ddl-auto: validate
security.jwt.secret: ${JWT_SECRET:replace-this-with-a-32-byte-production-secret}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
