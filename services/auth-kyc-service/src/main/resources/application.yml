server.port: 8081
spring:
  application.name: auth-kyc-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/user_kyc_db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa.hibernate.ddl-auto: ${DB_DDL_AUTO:update}
security.jwt.secret: ${JWT_SECRET:replace-this-with-a-32-byte-production-secret}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
